[project]
name = "autofisher"
version = "1.0.2"
description = "Audio-driven background fishing assistant for vanilla Terraria on Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy<2.0.0",
    "pyinstaller>=6.18.0",
    "scipy>=1.17.0",
    "soundcard>=0.4.5",
    "vgamepad==0.1.0; sys_platform == 'win32'",
]

[project.scripts]
autofisher = "autofisher.app:main"
